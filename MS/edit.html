<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>譜面台管理システム - 詳細編集</title>

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 0;

        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;

        background: #f5f6f7;
        color: #222;
      }

      /* ========================================
       ヘッダー
       ======================================== */

      .header {
        height: 50px;

        display: flex;
        align-items: center;

        padding: 0 10px;

        background: #fff;

        border-bottom: 1px solid #ddd;

        position: sticky;
        top: 0;

        z-index: 100;
      }

      .header-title {
        font-size: 16px;
        font-weight: 600;

        white-space: nowrap;
      }

      .header-brand {
        display: flex;
        align-items: center;

        color: inherit;
        text-decoration: none;
      }

      .header-logo {
        width: auto;
        height: 32px;
        margin-right: 8px;
      }

      .header-info {
        margin-left: auto;

        display: flex;
        align-items: center;

        gap: 8px;

        min-width: 0;
      }

      .last-updated {
        font-size: 10px;

        color: #999;

        white-space: nowrap;
      }

      .refresh-button {
        border: 1px solid #ccc;

        background: #fff;

        color: #333;

        border-radius: 5px;

        padding: 5px 8px;

        font-size: 12px;

        cursor: pointer;

        white-space: nowrap;
      }

      .refresh-button:active {
        background: #eee;
      }

      .refresh-button:disabled {
        opacity: 0.5;

        cursor: default;
      }

      /* ========================================
       メイン
       ======================================== */

      .container {
        width: 100%;

        max-width: 700px;

        margin: 0 auto;

        padding: 16px 12px 30px;
      }

      .page-title {
        margin: 0 0 14px;

        font-size: 20px;
        font-weight: 600;
      }

      /* ========================================
       メッセージ
       ======================================== */

      .message {
        display: none;

        margin-bottom: 12px;

        padding: 10px 12px;

        border-radius: 6px;

        font-size: 13px;
      }

      .message.show {
        display: block;
      }

      .message.info {
        background: #eef3fa;

        color: #365b8c;

        border: 1px solid #c5d5ea;
      }

      .message.success {
        background: #eef7ee;

        color: #357335;

        border: 1px solid #c4dec4;
      }

      .message.error {
        background: #fbeeee;

        color: #9a3333;

        border: 1px solid #e5baba;
      }

      /* ========================================
       フォーム
       ======================================== */

      .form-card {
        background: #fff;

        border: 1px solid #ddd;

        border-radius: 7px;

        padding: 16px;
      }

      .form-row {
        margin-bottom: 16px;
      }

      .form-row:last-child {
        margin-bottom: 0;
      }

      label {
        display: block;

        margin-bottom: 6px;

        font-size: 13px;

        font-weight: 600;

        color: #444;
      }

      input,
      select,
      textarea {
        width: 100%;

        border: 1px solid #ccc;

        border-radius: 6px;

        background: #fff;

        color: #222;

        font-family: inherit;

        font-size: 14px;
      }

      input,
      select {
        height: 40px;

        padding: 0 10px;
      }

      textarea {
        min-height: 100px;

        padding: 9px 10px;

        resize: vertical;

        line-height: 1.5;
      }

      input:focus,
      select:focus,
      textarea:focus {
        outline: none;

        border-color: #777;
      }

      /* ========================================
       ID
       ======================================== */

      .id-display {
        display: flex;

        align-items: center;

        min-height: 40px;

        padding: 0 10px;

        background: #f3f3f3;

        border: 1px solid #ddd;

        border-radius: 6px;

        color: #555;

        font-size: 14px;

        font-weight: 600;
      }

      .id-note {
        margin-top: 5px;

        color: #999;

        font-size: 11px;
      }

      /* ========================================
       保存
       ======================================== */

      .save-button {
        width: 100%;

        height: 44px;

        border: none;

        border-radius: 6px;

        background: #333;

        color: #fff;

        font-size: 14px;

        font-weight: 600;

        cursor: pointer;
      }

      .save-button:active {
        opacity: 0.8;
      }

      .save-button:disabled {
        opacity: 0.5;

        cursor: default;
      }

      /* ========================================
       戻る
       ======================================== */

      .back-area {
        margin-top: 12px;

        display: flex;

        gap: 8px;
      }

      .back-button {
        flex: 1;

        height: 40px;

        border: 1px solid #ccc;

        background: #fff;

        border-radius: 6px;

        font-size: 13px;

        cursor: pointer;
      }

      .back-button:active {
        background: #eee;
      }

      /* ========================================
       ローディング
       ======================================== */

      .loading {
        padding: 40px 20px;

        text-align: center;

        color: #888;

        font-size: 13px;
      }

      /* ========================================
       スマホ
       ======================================== */

      @media (max-width: 600px) {
        .container {
          padding: 12px 8px 24px;
        }

        .page-title {
          font-size: 18px;
        }

        .last-updated {
          font-size: 9px;
        }

        .refresh-button {
          padding: 5px 7px;

          font-size: 11px;
        }

        .form-card {
          padding: 13px;
        }
      }
    </style>
  </head>

  <body>
    <!-- ======================================
       ヘッダー
       ======================================= -->

    <header class="header">
      <a class="header-brand" href="index.html">
        <img class="header-logo" src="rogo.png" alt="" />
        <div class="header-title">譜面台管理システム</div>
      </a>

      <div class="header-info">
        <div id="lastUpdated" class="last-updated">最終更新：未取得</div>

        <button
          id="refreshButton"
          class="refresh-button"
          type="button"
          onclick="handleRefresh()"
        >
          ↻ 更新
        </button>
      </div>
    </header>

    <!-- ======================================
       メイン
       ======================================= -->

    <main class="container">
      <h1 class="page-title">譜面台を編集</h1>

      <!-- メッセージ -->

      <div id="message" class="message"></div>

      <!-- ローディング -->

      <div id="loading" class="loading">読み込み中...</div>

      <!-- フォーム -->

      <form
        id="editForm"
        class="form-card"
        style="display: none"
        onsubmit="handleSave(event)"
      >
        <!-- ID -->

        <div class="form-row">
          <label> 譜面台ID </label>

          <div id="standId" class="id-display"></div>

          <div class="id-note">IDは変更できません。</div>
        </div>

        <!-- 管理パート -->

        <div class="form-row">
          <label for="managementPart"> 管理パート </label>

          <select id="managementPart" required>
            <option value="">管理パートを選択</option>
          </select>
        </div>

        <!-- 使用状況 -->

        <div class="form-row">
          <label for="usageStatus"> 使用状況 </label>

          <select id="usageStatus" required>
            <option value="">使用状況を選択</option>
          </select>
        </div>

        <!-- 使用可否 -->

        <div class="form-row">
          <label for="availability"> 使用可否 </label>

          <select id="availability" required>
            <option value="">使用可否を選択</option>
          </select>
        </div>

        <!-- 損傷情報 -->

        <div class="form-row">
          <label for="damageInfo"> 損傷情報 </label>

          <textarea
            id="damageInfo"
            placeholder="損傷や不具合があれば入力してください"
          ></textarea>
        </div>

        <!-- メモ -->

        <div class="form-row">
          <label for="memo"> メモ </label>

          <textarea
            id="memo"
            placeholder="必要なメモがあれば入力してください"
          ></textarea>
        </div>

        <!-- 保存 -->

        <div class="form-row">
          <button id="saveButton" class="save-button" type="submit">
            保存する
          </button>
        </div>
      </form>

      <!-- 戻る -->

      <div class="back-area">
        <button class="back-button" type="button" onclick="goToList()">
          ← 一覧へ戻る
        </button>

        <button class="back-button" type="button" onclick="goHome()">
          メイン画面
        </button>
      </div>
    </main>

    <!-- ======================================
       JavaScript
       ======================================= -->

    <script src="config.js"></script>

    <script src="api.js"></script>

    <script src="dataStore.js"></script>

    <script>
      /**
       * ========================================
       * 現在編集中のID
       * ========================================
       */

      let currentStandId = "";

      /**
       * ========================================
       * 初期化
       * ========================================
       */

      document.addEventListener("DOMContentLoaded", initializePage);

      async function initializePage() {
        updateLastUpdatedText();

        /**
         * URLからID取得
         *
         * edit.html?id=A-001
         */

        const params = new URLSearchParams(window.location.search);

        const id = params.get("id");

        if (!id) {
          showMessage("譜面台IDが指定されていません。", "error");

          hideLoading();

          return;
        }

        currentStandId = id.trim().toUpperCase();

        try {
          /**
           * 24時間キャッシュを利用
           */
          await getStandData(EDIT_CACHE_HOURS);

          /**
           * ローカルデータから検索
           */
          const stand = findStandById(currentStandId);

          if (!stand) {
            showMessage(
              currentStandId + " の譜面台が見つかりませんでした。",
              "error",
            );

            hideLoading();

            return;
          }

          populateForm(stand);

          updateLastUpdatedText();

          hideLoading();

          showForm();
        } catch (error) {
          console.error("編集画面初期化エラー:", error);

          showMessage(
            error.message || "譜面台データの取得に失敗しました。",
            "error",
          );

          hideLoading();
        }
      }

      /**
       * ========================================
       * フォームへデータ設定
       * ========================================
       */

      function populateForm(stand) {
        document.getElementById("standId").textContent = stand.ID || "";

        /**
         * プルダウンを作成
         */

        setupManagementPartSelect("managementPart", "管理パートを選択");

        setupUsageStatusSelect("usageStatus", "使用状況を選択");

        setupAvailabilitySelect("availability", "使用可否を選択");

        /**
         * 値を設定
         */

        document.getElementById("managementPart").value =
          stand["管理パート"] || "";

        document.getElementById("usageStatus").value = stand["使用状況"] || "";

        document.getElementById("availability").value = stand["使用可否"] || "";

        document.getElementById("damageInfo").value = stand["損傷情報"] || "";

        document.getElementById("memo").value = stand["メモ"] || "";
      }

      /**
       * ========================================
       * 保存
       * ========================================
       */

      async function handleSave(event) {
        event.preventDefault();

        if (!currentStandId) {
          showMessage("譜面台IDが指定されていません。", "error");

          return;
        }

        const saveButton = document.getElementById("saveButton");

        saveButton.disabled = true;

        saveButton.textContent = "保存中...";

        hideMessage();

        try {
          /**
           * 入力値取得
           */

          const data = {
            管理パート: document.getElementById("managementPart").value,

            使用状況: document.getElementById("usageStatus").value,

            使用可否: document.getElementById("availability").value,

            損傷情報: document.getElementById("damageInfo").value,

            メモ: document.getElementById("memo").value,
          };

          /**
           * 必須チェック
           */

          if (!data["管理パート"]) {
            throw new Error("管理パートを選択してください。");
          }

          if (!data["使用状況"]) {
            throw new Error("使用状況を選択してください。");
          }

          if (!data["使用可否"]) {
            throw new Error("使用可否を選択してください。");
          }

          /**
           * ====================================
           * GASへ更新
           * ====================================
           *
           * ここでは必ずGASへ通信する。
           */

          const updatedStand = await updateStand(currentStandId, data);

          /**
           * ====================================
           * localStorage更新
           * ====================================
           */

          updateStoredStand(updatedStand);

          /**
           * 表示更新
           */

          populateForm(updatedStand);

          updateLastUpdatedText();

          showMessage("保存しました。", "success");
        } catch (error) {
          console.error("保存エラー:", error);

          showMessage(error.message || "保存に失敗しました。", "error");
        } finally {
          saveButton.disabled = false;

          saveButton.textContent = "保存する";
        }
      }

      /**
       * ========================================
       * 強制更新
       * ========================================
       */

      async function handleRefresh() {
        const button = document.getElementById("refreshButton");

        button.disabled = true;

        button.textContent = "更新中...";

        hideMessage();

        try {
          /**
           * 全データをGASから再取得
           */
          await refreshStandData();

          /**
           * 現在のIDを再検索
           */
          const stand = findStandById(currentStandId);

          if (!stand) {
            throw new Error(
              currentStandId + " の譜面台が見つかりませんでした。",
            );
          }

          populateForm(stand);

          updateLastUpdatedText();

          showMessage("最新の情報に更新しました。", "info");
        } catch (error) {
          console.error("手動更新エラー:", error);

          showMessage(error.message || "更新に失敗しました。", "error");
        } finally {
          button.disabled = false;

          button.textContent = "↻ 更新";
        }
      }

      /**
       * ========================================
       * 最終更新日時
       * ========================================
       */

      function updateLastUpdatedText() {
        const element = document.getElementById("lastUpdated");

        element.textContent = "最終更新：" + getLastUpdatedText();
      }

      /**
       * ========================================
       * ローディング
       * ========================================
       */

      function hideLoading() {
        document.getElementById("loading").style.display = "none";
      }

      function showForm() {
        document.getElementById("editForm").style.display = "block";
      }

      /**
       * ========================================
       * 一覧へ
       * ========================================
       */

      function goToList() {
        window.location.href = "list.html";
      }

      /**
       * ========================================
       * メインへ
       * ========================================
       */

      function goHome() {
        window.location.href = "index.html";
      }

      /**
       * ========================================
       * メッセージ
       * ========================================
       */

      function showMessage(text, type = "info") {
        const element = document.getElementById("message");

        element.textContent = text;

        element.className = "message show " + type;
      }

      function hideMessage() {
        const element = document.getElementById("message");

        element.className = "message";

        element.textContent = "";
      }
    </script>
  </body>
</html>
