<!DOCTYPE html>
<html lang="ja">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>譜面台管理システム</title>


  <!-- 共通設定 -->
  <script src="config.js"></script>

  <!-- 共通API -->
  <script src="api.js"></script>


  <style>

    * {
      box-sizing: border-box;
    }


    body {
      margin: 0;
      padding: 0;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      background: #f5f6f8;
      color: #222;
    }


    .container {
      width: 100%;
      max-width: 900px;

      margin: 0 auto;

      padding: 24px 16px 60px;
    }


    h1 {
      margin: 0 0 24px;

      font-size: 28px;
      font-weight: 700;
    }


    h2 {
      margin: 0 0 18px;

      font-size: 20px;
    }


    .menu {
      display: grid;

      grid-template-columns:
        repeat(2, 1fr);

      gap: 12px;

      margin-bottom: 24px;
    }


    button {
      border: none;

      border-radius: 8px;

      padding: 12px 18px;

      font-size: 15px;

      cursor: pointer;
    }


    .menu button {
      min-height: 52px;

      background: #222;
      color: white;

      font-weight: 600;
    }


    .menu button:hover {
      opacity: 0.85;
    }


    .card {
      background: white;

      border-radius: 10px;

      padding: 20px;

      margin-bottom: 20px;

      box-shadow:
        0 2px 8px rgba(0, 0, 0, 0.06);
    }


    .search-area {
      display: flex;

      gap: 8px;
    }


    .search-area input {
      flex: 1;
    }


    input,
    select,
    textarea {
      width: 100%;

      padding: 10px 12px;

      border: 1px solid #ccc;

      border-radius: 6px;

      font-size: 15px;

      background: white;
    }


    input:focus,
    select:focus,
    textarea:focus {
      outline: none;

      border-color: #666;
    }


    textarea {
      min-height: 100px;

      resize: vertical;
    }


    label {
      display: block;

      margin-bottom: 6px;

      font-size: 14px;

      font-weight: 600;
    }


    .form-group {
      margin-bottom: 16px;
    }


    .form-grid {
      display: grid;

      grid-template-columns:
        repeat(2, 1fr);

      gap: 16px;
    }


    .id-display {
      padding: 12px;

      border-radius: 6px;

      background: #f1f2f4;

      font-size: 18px;

      font-weight: 700;

      letter-spacing: 0.5px;
    }


    .id-placeholder {
      color: #888;

      font-weight: 400;
    }


    .button-row {
      display: flex;

      gap: 8px;

      margin-top: 20px;
    }


    .primary-button {
      background: #222;

      color: white;

      font-weight: 600;
    }


    .secondary-button {
      background: #e8e9ec;

      color: #222;
    }


    .danger-button {
      background: #eee;

      color: #555;
    }


    .message {
      display: none;

      margin-bottom: 16px;

      padding: 12px;

      border-radius: 6px;

      font-size: 14px;
    }


    .message.success {
      display: block;

      background: #e8f5e9;

      color: #2e7d32;
    }


    .message.error {
      display: block;

      background: #ffebee;

      color: #c62828;
    }


    .stand-info {
      display: none;
    }


    .stand-info.visible {
      display: block;
    }


    .info-grid {
      display: grid;

      grid-template-columns:
        repeat(2, 1fr);

      gap: 12px;
    }


    .info-item {
      padding: 12px;

      background: #f7f7f8;

      border-radius: 6px;
    }


    .info-label {
      margin-bottom: 4px;

      font-size: 12px;

      color: #777;
    }


    .info-value {
      font-size: 15px;

      white-space: pre-wrap;

      word-break: break-word;
    }


    .loading {
      display: none;

      margin-top: 12px;

      color: #777;

      font-size: 14px;
    }


    .loading.visible {
      display: block;
    }


    @media (max-width: 600px) {

      .container {
        padding:
          16px
          12px
          40px;
      }


      h1 {
        font-size: 24px;
      }


      .menu {
        grid-template-columns: 1fr;
      }


      .form-grid {
        grid-template-columns: 1fr;
      }


      .info-grid {
        grid-template-columns: 1fr;
      }


      .search-area {
        flex-direction: column;
      }


      .button-row {
        flex-direction: column;
      }

    }

  </style>

</head>


<body>


<div class="container">


  <h1>譜面台管理システム</h1>


  <!-- ============================== -->
  <!-- メニュー -->
  <!-- ============================== -->

  <div class="menu">

    <button
      type="button"
      onclick="showAddForm()"
    >
      ＋ 譜面台を追加
    </button>


    <button
      type="button"
      onclick="goToList()"
    >
      譜面台を管理
    </button>

  </div>


  <!-- ============================== -->
  <!-- メッセージ -->
  <!-- ============================== -->

  <div
    id="message"
    class="message"
  ></div>


  <!-- ============================== -->
  <!-- 検索 -->
  <!-- ============================== -->

  <div class="card">

    <h2>譜面台を検索</h2>


    <div class="search-area">

      <input
        id="searchId"
        type="text"
        placeholder="例：A-001"
        autocomplete="off"
      >


      <button
        type="button"
        class="primary-button"
        onclick="searchStand()"
      >
        検索
      </button>

    </div>


    <div
      id="searchLoading"
      class="loading"
    >
      検索中...
    </div>

  </div>


  <!-- ============================== -->
  <!-- 検索結果 -->
  <!-- ============================== -->

  <div
    id="standInfo"
    class="card stand-info"
  >

    <h2>譜面台情報</h2>


    <div class="info-grid">


      <div class="info-item">

        <div class="info-label">
          ID
        </div>

        <div
          id="infoId"
          class="info-value"
        ></div>

      </div>


      <div class="info-item">

        <div class="info-label">
          管理パート
        </div>

        <div
          id="infoPart"
          class="info-value"
        ></div>

      </div>


      <div class="info-item">

        <div class="info-label">
          使用状況
        </div>

        <div
          id="infoUsage"
          class="info-value"
        ></div>

      </div>


      <div class="info-item">

        <div class="info-label">
          使用可否
        </div>

        <div
          id="infoAvailability"
          class="info-value"
        ></div>

      </div>


      <div class="info-item">

        <div class="info-label">
          損傷情報
        </div>

        <div
          id="infoDamage"
          class="info-value"
        ></div>

      </div>


      <div class="info-item">

        <div class="info-label">
          メモ
        </div>

        <div
          id="infoMemo"
          class="info-value"
        ></div>

      </div>


    </div>


    <div class="button-row">

      <button
        type="button"
        class="secondary-button"
        onclick="editCurrentStand()"
      >
        詳細編集
      </button>

    </div>

  </div>


  <!-- ============================== -->
  <!-- 譜面台追加 -->
  <!-- ============================== -->

  <div
    id="addCard"
    class="card"
  >

    <h2>譜面台を追加</h2>


    <!-- タイプ -->

    <div class="form-group">

      <label for="standType">
        タイプ
      </label>


      <select
        id="standType"
        onchange="onTypeChange()"
      ></select>

    </div>


    <!-- 自動生成ID -->

    <div class="form-group">

      <label>
        新しい譜面台ID
      </label>


      <div
        id="newStandId"
        class="id-display"
      >

        <span class="id-placeholder">
          タイプを選択してください
        </span>

      </div>

    </div>


    <!-- 基本情報 -->

    <div class="form-grid">


      <!-- 管理パート -->

      <div class="form-group">

        <label for="managementPart">
          管理パート
        </label>


        <select
          id="managementPart"
        ></select>

      </div>


      <!-- 使用状況 -->

      <div class="form-group">

        <label for="usageStatus">
          使用状況
        </label>


        <select
          id="usageStatus"
        ></select>

      </div>


      <!-- 使用可否 -->

      <div class="form-group">

        <label for="availabilityStatus">
          使用可否
        </label>


        <select
          id="availabilityStatus"
        ></select>

      </div>


    </div>


    <!-- 損傷情報 -->

    <div class="form-group">

      <label for="damageInfo">
        損傷情報
      </label>


      <textarea
        id="damageInfo"
        placeholder="損傷や不具合があれば入力してください"
      ></textarea>

    </div>


    <!-- メモ -->

    <div class="form-group">

      <label for="memo">
        メモ
      </label>


      <textarea
        id="memo"
        placeholder="必要なメモを入力してください"
      ></textarea>

    </div>


    <div class="button-row">

      <button
        type="button"
        class="primary-button"
        onclick="registerStand()"
      >
        登録
      </button>


      <button
        type="button"
        class="secondary-button"
        onclick="clearAddForm()"
      >
        クリア
      </button>

    </div>


    <div
      id="addLoading"
      class="loading"
    >
      登録中...
    </div>

  </div>


</div>


<script>

/**
 * ========================================
 * 初期化
 * ========================================
 */

document.addEventListener(
  "DOMContentLoaded",
  () => {

    initializePage();

  }
);


/**
 * ページ初期化
 */
function initializePage() {

  /**
   * config.jsから
   * プルダウンを生成
   */

  setupStandTypeSelect(
    "standType",
    "タイプを選択"
  );


  setupManagementPartSelect(
    "managementPart",
    "管理パートを選択"
  );


  setupUsageStatusSelect(
    "usageStatus",
    "使用状況を選択"
  );


  setupAvailabilitySelect(
    "availabilityStatus",
    "使用可否を選択"
  );


  /**
   * URLパラメータを確認
   *
   * ?id=A-001
   */

  const params =
    new URLSearchParams(
      window.location.search
    );


  const id =
    params.get("id");


  if (id) {

    document
      .getElementById("searchId")
      .value = id;


    searchStand();

  }

}


/**
 * ========================================
 * メニュー
 * ========================================
 */


/**
 * 譜面台管理画面へ
 */
function goToList() {

  window.location.href =
    "list.html";

}


/**
 * 追加フォームを表示
 */
function showAddForm() {

  const card =
    document.getElementById(
      "addCard"
    );


  card.scrollIntoView({
    behavior: "smooth",
    block: "start"
  });

}


/**
 * ========================================
 * 検索
 * ========================================
 */


/**
 * 譜面台検索
 */
async function searchStand() {

  const input =
    document.getElementById(
      "searchId"
    );


  const id =
    input.value.trim();


  if (!id) {

    showMessage(
      "譜面台IDを入力してください",
      "error"
    );

    return;

  }


  const loading =
    document.getElementById(
      "searchLoading"
    );


  loading.classList.add(
    "visible"
  );


  hideMessage();


  try {

    const stand =
      await getStandById(id);


    if (!stand) {

      throw new Error(
        "譜面台が見つかりません"
      );

    }


    displayStand(
      stand
    );


  } catch (error) {

    hideStandInfo();


    showMessage(
      error.message ||
      "検索に失敗しました",
      "error"
    );

  } finally {

    loading.classList.remove(
      "visible"
    );

  }

}


/**
 * Enterキーでも検索
 */
document.addEventListener(
  "keydown",
  event => {

    if (
      event.key === "Enter" &&
      document.activeElement.id ===
        "searchId"
    ) {

      searchStand();

    }

  }
);


/**
 * 検索結果表示
 */
function displayStand(
  stand
) {

  document.getElementById(
    "infoId"
  ).textContent =
    stand.ID || "";


  document.getElementById(
    "infoPart"
  ).textContent =
    stand.管理パート || "";


  document.getElementById(
    "infoUsage"
  ).textContent =
    stand.使用状況 || "";


  document.getElementById(
    "infoAvailability"
  ).textContent =
    stand.使用可否 || "";


  document.getElementById(
    "infoDamage"
  ).textContent =
    stand.損傷情報 || "";


  document.getElementById(
    "infoMemo"
  ).textContent =
    stand.メモ || "";


  document
    .getElementById("standInfo")
    .classList.add("visible");


  /**
   * 現在表示しているIDを保存
   */
  currentStandId =
    stand.ID || "";

}


/**
 * 検索結果を非表示
 */
function hideStandInfo() {

  document
    .getElementById("standInfo")
    .classList.remove(
      "visible"
    );

}


/**
 * ========================================
 * 詳細編集
 * ========================================
 */


/**
 * 現在表示中の譜面台を編集
 */
function editCurrentStand() {

  if (!currentStandId) {

    showMessage(
      "編集する譜面台がありません",
      "error"
    );

    return;

  }


  window.location.href =
    "edit.html?id=" +
    encodeURIComponent(
      currentStandId
    );

}


/**
 * 現在表示中の譜面台ID
 */
let currentStandId = "";


/**
 * ========================================
 * 追加
 * ========================================
 */


/**
 * タイプ変更時
 */
async function onTypeChange() {

  const type =
    document.getElementById(
      "standType"
    ).value;


  const idDisplay =
    document.getElementById(
      "newStandId"
    );


  /**
   * タイプ未選択
   */
  if (!type) {

    idDisplay.innerHTML =
      '<span class="id-placeholder">' +
      'タイプを選択してください' +
      '</span>';

    return;

  }


  idDisplay.textContent =
    "取得中...";


  try {

    /**
     * 次のIDを取得
     *
     * 例：
     * A-001
     * A-002
     * A-003
     */

    const id =
      await getNextId(type);


    idDisplay.textContent =
      id;

  } catch (error) {

    idDisplay.innerHTML =
      '<span class="id-placeholder">' +
      'IDを取得できませんでした' +
      '</span>';


    showMessage(
      error.message ||
      "次のIDの取得に失敗しました",
      "error"
    );

  }

}


/**
 * 譜面台登録
 */
async function registerStand() {

  const type =
    document.getElementById(
      "standType"
    ).value;


  const managementPart =
    document.getElementById(
      "managementPart"
    ).value;


  const usageStatus =
    document.getElementById(
      "usageStatus"
    ).value;


  const availabilityStatus =
    document.getElementById(
      "availabilityStatus"
    ).value;


  const damageInfo =
    document.getElementById(
      "damageInfo"
    ).value.trim();


  const memo =
    document.getElementById(
      "memo"
    ).value.trim();


  /**
   * 必須チェック
   */

  if (!type) {

    showMessage(
      "タイプを選択してください",
      "error"
    );

    return;

  }


  if (!managementPart) {

    showMessage(
      "管理パートを選択してください",
      "error"
    );

    return;

  }


  if (!usageStatus) {

    showMessage(
      "使用状況を選択してください",
      "error"
    );

    return;

  }


  if (!availabilityStatus) {

    showMessage(
      "使用可否を選択してください",
      "error"
    );

    return;

  }


  const loading =
    document.getElementById(
      "addLoading"
    );


  loading.classList.add(
    "visible"
  );


  hideMessage();


  try {

    /**
     * サーバー側で
     * 実際のIDを生成する
     */

    const stand =
      await addStand(
        type,
        {

          管理パート:
            managementPart,

          使用状況:
            usageStatus,

          使用可否:
            availabilityStatus,

          損傷情報:
            damageInfo,

          メモ:
            memo

        }
      );


    /**
     * 登録成功
     */

    showMessage(
      "譜面台を登録しました",
      "success"
    );


    /**
     * 登録した譜面台を表示
     */

    if (stand) {

      displayStand(
        stand
      );

    }


    /**
     * フォームをクリア
     *
     * 登録したIDは表示結果として
     * 残しておく。
     */

    clearAddForm();


  } catch (error) {

    showMessage(
      error.message ||
      "登録に失敗しました",
      "error"
    );

  } finally {

    loading.classList.remove(
      "visible"
    );

  }

}


/**
 * 追加フォームをクリア
 */
function clearAddForm() {

  document.getElementById(
    "standType"
  ).value = "";


  document.getElementById(
    "managementPart"
  ).value = "";


  document.getElementById(
    "usageStatus"
  ).value = "";


  document.getElementById(
    "availabilityStatus"
  ).value = "";


  document.getElementById(
    "damageInfo"
  ).value = "";


  document.getElementById(
    "memo"
  ).value = "";


  document.getElementById(
    "newStandId"
  ).innerHTML =
    '<span class="id-placeholder">' +
    'タイプを選択してください' +
    '</span>';

}


/**
 * ========================================
 * メッセージ
 * ========================================
 */


/**
 * メッセージ表示
 */
function showMessage(
  message,
  type
) {

  const element =
    document.getElementById(
      "message"
    );


  element.textContent =
    message;


  element.className =
    "message " +
    type;

}


/**
 * メッセージ非表示
 */
function hideMessage() {

  const element =
    document.getElementById(
      "message"
    );


  element.textContent =
    "";


  element.className =
    "message";

}

</script>


</body>

</html>
