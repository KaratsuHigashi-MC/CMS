<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>譜面台管理システム - ホーム</title>

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 0;

        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;

        background: #f5f6f7;
        color: #222;
      }

      /* ========================================
       ヘッダー
       ======================================== */

      .header {
        height: 50px;

        display: flex;
        align-items: center;

        padding: 0 10px;

        background: #fff;

        border-bottom: 1px solid #ddd;

        position: sticky;
        top: 0;

        z-index: 100;
      }

      .header-title {
        font-size: 16px;
        font-weight: 600;

        white-space: nowrap;
      }

      .header-brand {
        display: flex;
        align-items: center;

        color: inherit;
        text-decoration: none;
      }

      .header-logo {
        width: auto;
        height: 32px;
        margin-right: 8px;
      }

      .header-info {
        margin-left: auto;

        display: flex;
        align-items: center;

        gap: 8px;

        min-width: 0;
      }

      .last-updated {
        font-size: 10px;

        color: #999;

        white-space: nowrap;
      }

      .refresh-button {
        border: 1px solid #ccc;

        background: #fff;

        color: #333;

        border-radius: 5px;

        padding: 5px 8px;

        font-size: 12px;

        cursor: pointer;

        white-space: nowrap;
      }

      .refresh-button:active {
        background: #eee;
      }

      .refresh-button:disabled {
        opacity: 0.5;
        cursor: default;
      }

      /* ========================================
       メイン
       ======================================== */

      .container {
        width: 100%;

        max-width: 700px;

        margin: 0 auto;

        padding: 16px 12px 30px;
      }

      .actual-keypad-mode .container {
        display: flex;

        flex-direction: column;

        justify-content: center;

        min-height: calc(100vh - 50px);

        min-height: calc(100dvh - 50px);

        padding-top: 16px;

        padding-bottom: 16px;
      }

      .page-title {
        margin: 0 0 14px;

        font-size: 20px;
        font-weight: 600;
      }

      /* ========================================
       メッセージ
       ======================================== */

      .message {
        display: none;

        margin-bottom: 12px;

        padding: 10px 12px;

        border-radius: 6px;

        font-size: 13px;
      }

      .message.show {
        display: block;
      }

      .message.info {
        background: #eef3fa;
        color: #365b8c;

        border: 1px solid #c5d5ea;
      }

      .message.success {
        background: #eef7ee;
        color: #357335;

        border: 1px solid #c4dec4;
      }

      .message.error {
        background: #fbeeee;
        color: #9a3333;

        border: 1px solid #e5baba;
      }

      /* ========================================
       検索カード
       ======================================== */

      .search-card {
        border: 1px solid #ddd;

        border-radius: 7px;

        padding: 16px;

        margin-bottom: 12px;
      }

      .search-card.actual-hidden,
      .main-menu.actual-hidden,
      .add-card.actual-hidden {
        display: none;
      }

      .keypad-card {
        display: none;

        width: 100%;

        max-width: 480px;

        margin: auto;

        padding: 16px;

        background: #fff;

        border: 1px solid #ddd;

        border-radius: 7px;
      }

      .keypad-card.show {
        display: block;
      }

      .keypad-heading-row {
        display: flex;

        flex-wrap: wrap;

        align-items: center;

        gap: 8px;

        margin-bottom: 14px;
      }

      .keypad-heading-row .section-title {
        margin: 0;
      }

      .keypad-step {
        display: none;
      }

      .keypad-step.active {
        display: block;
      }

      .keypad-heading-row .message {
        width: 100%;

        margin: 0;

        overflow-wrap: anywhere;
      }

      .keypad-label {
        margin: 14px 0 8px;

        color: #555;

        font-size: 13px;

        font-weight: 600;
      }

      .keypad-types {
        display: grid;

        grid-template-columns: repeat(auto-fit, minmax(72px, 1fr));

        gap: 8px;
      }

      .keypad-type-button,
      .keypad-key,
      .keypad-action {
        min-height: 56px;

        border: 1px solid #bbb;

        border-radius: 6px;

        background: #fff;

        color: #222;

        font: inherit;

        font-size: 18px;

        touch-action: manipulation;
      }

      .keypad-type-button[aria-pressed="true"] {
        border-color: #333;

        background: #333;

        color: #fff;
      }

      .keypad-id-display {
        display: flex;

        align-items: center;

        justify-content: center;

        min-height: 58px;

        margin-top: 14px;

        border: 1px solid #ddd;

        border-radius: 6px;

        background: #f5f6f7;

        font-size: 24px;

        font-weight: 600;
      }

      .keypad-grid {
        display: grid;

        grid-template-columns: repeat(3, 1fr);

        gap: 8px;

        margin-top: 12px;
      }

      .keypad-key:last-child {
        grid-column: 2;
      }

      .keypad-key:disabled {
        opacity: 0.45;
      }

      .keypad-controls {
        display: grid;

        grid-template-columns: 1fr 1fr 1.5fr;

        gap: 8px;

        margin-top: 8px;
      }

      .keypad-action {
        min-height: 52px;

        font-size: 15px;
      }

      .keypad-action.search {
        border-color: #333;

        background: #333;

        color: #fff;
      }

      .keypad-action:disabled {
        opacity: 0.45;
      }

      .actual-result-panel {
        display: none;

        max-width: 700px;

        margin: 16px auto;
      }

      .actual-result-panel.show {
        display: block;
      }

      .actual-result-panel .message {
        margin-bottom: 12px;
      }

      .actual-return-button {
        width: 100%;

        min-height: 44px;

        border: 1px solid #bbb;

        border-radius: 6px;

        background: #fff;

        color: #222;

        font: inherit;

        font-size: 14px;

        touch-action: manipulation;
      }

      .actual-mode .standard-stand-actions {
        display: none;
      }

      .actual-stand-actions {
        display: none;
      }

      .actual-mode .actual-stand-actions {
        display: flex;
      }

      .section-title {
        margin: 0 0 10px;

        font-size: 14px;
        font-weight: 600;
      }

      .search-heading-row {
        display: flex;

        flex-wrap: wrap;

        align-items: center;

        gap: 8px;

        margin-bottom: 10px;
      }

      .search-heading-row .section-title {
        margin: 0;
      }

      .search-heading-row .message {
        max-width: 70%;

        margin: 0 0 0 auto;

        padding: 5px 8px;

        overflow-wrap: anywhere;

        font-size: 12px;
      }

      .search-area {
        display: flex;

        gap: 8px;
      }

      .search-input {
        flex: 1;

        min-width: 0;

        height: 42px;

        padding: 0 10px;

        border: 1px solid #ccc;

        border-radius: 6px;

        background: #fff;

        font-size: 14px;
      }

      .search-input:focus {
        outline: none;

        border-color: #777;
      }

      .search-button {
        height: 42px;

        padding: 0 15px;

        border: none;

        border-radius: 6px;

        background: #333;

        color: #fff;

        font-size: 14px;

        cursor: pointer;

        white-space: nowrap;
      }

      .search-button:active {
        opacity: 0.8;
      }

      /* ========================================
       譜面台情報
       ======================================== */

      .stand-card {
        display: none;

        background: #fff;

        border: 1px solid #ddd;

        border-radius: 7px;

        padding: 16px;

        margin-bottom: 12px;
      }

      .stand-card.show {
        display: block;
      }

      .results-card {
        display: none;

        margin-bottom: 12px;

        padding: 14px;

        background: #fff;

        border: 1px solid #ddd;

        border-radius: 7px;
      }

      .results-card.show {
        display: block;
      }

      .results-info {
        display: flex;

        justify-content: space-between;

        align-items: center;

        margin-bottom: 8px;

        color: #777;

        font-size: 12px;
      }

      .results-wrapper {
        width: 100%;

        overflow-x: auto;

        border: 1px solid #ddd;

        border-radius: 6px;
      }

      .results-table {
        width: 100%;

        min-width: 700px;

        border-collapse: collapse;
      }

      .results-table th,
      .results-table td {
        padding: 9px 8px;

        border-bottom: 1px solid #eee;

        text-align: left;

        font-size: 13px;

        vertical-align: middle;
      }

      .results-table th {
        background: #f7f7f7;

        color: #555;

        font-weight: 600;

        white-space: nowrap;
      }

      .results-table tbody tr:last-child td {
        border-bottom: none;
      }

      .results-table tbody tr:hover {
        background: #fafafa;
      }

      .result-id-cell {
        font-weight: 600;

        white-space: nowrap;
      }

      .result-text-cell {
        max-width: 220px;

        overflow: hidden;

        text-overflow: ellipsis;

        white-space: nowrap;
      }

      .result-edit-button {
        padding: 5px 9px;

        border: 1px solid #bbb;

        border-radius: 5px;

        background: #fff;

        font-size: 12px;

        white-space: nowrap;

        cursor: pointer;
      }

      .results-empty {
        display: none;

        padding: 30px 16px;

        color: #999;

        font-size: 13px;

        text-align: center;
      }

      .stand-id {
        margin-bottom: 14px;

        font-size: 22px;
        font-weight: 600;
      }

      .info-row {
        display: flex;

        padding: 9px 0;

        border-bottom: 1px solid #eee;

        font-size: 13px;
      }

      .info-row:last-child {
        border-bottom: none;
      }

      .info-label {
        width: 90px;

        flex-shrink: 0;

        color: #777;
      }

      .info-value {
        flex: 1;

        min-width: 0;

        white-space: pre-wrap;

        word-break: break-word;
      }

      /* ========================================
       状態ラベル
       ======================================== */

      .status {
        display: inline-block;

        padding: 3px 7px;

        border-radius: 4px;

        font-size: 11px;
      }

      .status-available {
        background: #eef7ee;
        color: #357335;
      }

      .status-warning {
        background: #fff7e5;
        color: #8a6500;
      }

      .status-unavailable {
        background: #fbeeee;
        color: #9a3333;
      }

      .status-using {
        background: #eef3fa;
        color: #365b8c;
      }

      .status-free {
        background: #f2f2f2;
        color: #666;
      }

      /* ========================================
       ボタン
       ======================================== */

      .button-area {
        display: flex;

        gap: 8px;

        margin-top: 14px;
      }

      .primary-button,
      .secondary-button {
        flex: 1;

        height: 42px;

        border-radius: 6px;

        font-size: 13px;

        cursor: pointer;
      }

      .primary-button {
        border: none;

        background: #333;

        color: #fff;
      }

      .secondary-button {
        border: 1px solid #ccc;

        background: #fff;

        color: #333;
      }

      .primary-button:active,
      .secondary-button:active {
        opacity: 0.8;
      }

      /* ========================================
       追加カード
       ======================================== */

      .add-card {
        display: none;

        background: #fff;

        border: 1px solid #ddd;

        border-radius: 7px;

        padding: 16px;

        margin-bottom: 12px;
      }

      .add-card.show {
        display: block;
      }

      .form-row {
        margin-bottom: 15px;
      }

      .form-row:last-child {
        margin-bottom: 0;
      }

      label {
        display: block;

        margin-bottom: 6px;

        font-size: 13px;

        font-weight: 600;

        color: #444;
      }

      input,
      select,
      textarea {
        width: 100%;

        border: 1px solid #ccc;

        border-radius: 6px;

        background: #fff;

        color: #222;

        font-family: inherit;

        font-size: 14px;
      }

      input,
      select {
        height: 40px;

        padding: 0 10px;
      }

      textarea {
        min-height: 90px;

        padding: 9px 10px;

        resize: vertical;

        line-height: 1.5;
      }

      input:focus,
      select:focus,
      textarea:focus {
        outline: none;

        border-color: #777;
      }

      /* ========================================
       ID表示
       ======================================== */

      .id-display {
        display: flex;

        align-items: center;

        min-height: 40px;

        padding: 0 10px;

        background: #f3f3f3;

        border: 1px solid #ddd;

        border-radius: 6px;

        color: #555;

        font-size: 14px;

        font-weight: 600;
      }

      .id-note {
        margin-top: 5px;

        color: #999;

        font-size: 11px;
      }

      /* ========================================
       ローディング
       ======================================== */

      .loading {
        display: none;

        padding: 30px 20px;

        text-align: center;

        color: #888;

        font-size: 13px;
      }

      .loading.show {
        display: block;
      }

      /* ========================================
       スマホ
       ======================================== */

      @media (max-width: 600px) {
        .container {
          padding: 12px 8px 24px;
        }

        .page-title {
          font-size: 18px;
        }

        .last-updated {
          font-size: 9px;
        }

        .refresh-button {
          padding: 5px 7px;

          font-size: 11px;
        }

        .search-card,
        .stand-card,
        .add-card {
          padding: 13px;
        }

        .keypad-card {
          padding: 13px;
        }

        .info-label {
          width: 80px;
        }
      }
    </style>
  </head>

  <body>
    <!-- ======================================
       ヘッダー
       ======================================= -->

    <header class="header">
      <a class="header-brand" href="index.html">
        <img class="header-logo" src="rogo.png" alt="" />
      </a>

      <div class="header-info">
        <div id="lastUpdated" class="last-updated">最終更新：未取得</div>

        <button
          id="refreshButton"
          class="refresh-button"
          type="button"
          onclick="handleRefresh()"
        >
          ↻ 更新
        </button>
      </div>
    </header>

    <!-- ======================================
       メイン
       ======================================= -->

    <main class="container">
      <!-- ローディング -->

      <div id="loading" class="loading">読み込み中...</div>

      <!-- ====================================
         検索
         ===================================== -->

      <section id="searchCard" class="search-card">
        <div class="search-heading-row">
          <h2 class="section-title">譜面台を検索</h2>

          <div id="message" class="message"></div>
        </div>

        <div class="search-area">
          <input
            id="searchInput"
            class="search-input"
            type="search"
            placeholder="ID・タイプ・使用状況などで検索"
            autocomplete="off"
          />

          <button class="search-button" type="button" onclick="handleSearch()">
            検索
          </button>
        </div>
      </section>

      <section id="keypadCard" class="keypad-card">
        <div id="keypadTypeStep" class="keypad-step active">
          <div class="keypad-heading-row">
            <h2 class="section-title">タイプを選択</h2>

            <div id="keypadMessage" class="message"></div>
          </div>

          <div id="keypadTypes" class="keypad-types"></div>
        </div>

        <div id="keypadNumberStep" class="keypad-step">
          <div class="keypad-heading-row">
            <h2 class="section-title">番号を入力</h2>

            <button
              class="keypad-action"
              type="button"
              onclick="backToKeypadTypes()"
            >
              タイプを選び直す
            </button>
          </div>

          <div
            id="keypadIdDisplay"
            class="keypad-id-display"
            aria-live="polite"
          >
            タイプを選択してください
          </div>

          <div id="keypadGrid" class="keypad-grid"></div>

          <div class="keypad-controls">
            <button
              class="keypad-action"
              type="button"
              onclick="backspaceKeypadNumber()"
            >
              1文字削除
            </button>

            <button
              class="keypad-action"
              type="button"
              onclick="clearKeypadNumber()"
            >
              クリア
            </button>

            <button
              id="keypadSearchButton"
              class="keypad-action search"
              type="button"
              onclick="searchKeypadStand()"
              disabled
            >
              検索
            </button>
          </div>
        </div>
      </section>

      <section id="actualResultPanel" class="actual-result-panel">
        <div id="actualResultMessage" class="message"></div>

        <button
          class="actual-return-button"
          type="button"
          onclick="returnToActualKeypad()"
        >
          別の譜面台を検索
        </button>
      </section>

      <!-- ====================================
         メニュー
         ===================================== -->

      <div id="mainMenu" class="button-area main-menu">
        <button class="primary-button" type="button" onclick="showAddForm()">
          ＋ 譜面台を追加
        </button>

        <button class="secondary-button" type="button" onclick="goToList()">
          譜面台を管理
        </button>
      </div>

      <!-- ====================================
         譜面台情報
         ===================================== -->

      <section id="standCard" class="stand-card">
        <div id="standId" class="stand-id"></div>

        <div class="info-row">
          <div class="info-label">管理パート</div>

          <div id="managementPartValue" class="info-value"></div>
        </div>

        <div class="info-row">
          <div class="info-label">使用状況</div>

          <div id="usageStatusValue" class="info-value"></div>
        </div>

        <div class="info-row">
          <div class="info-label">使用可否</div>

          <div id="availabilityValue" class="info-value"></div>
        </div>

        <div class="info-row">
          <div class="info-label">損傷情報</div>

          <div id="damageInfoValue" class="info-value"></div>
        </div>

        <div class="info-row">
          <div class="info-label">メモ</div>

          <div id="memoValue" class="info-value"></div>
        </div>

        <div class="button-area standard-stand-actions">
          <button
            class="primary-button"
            type="button"
            onclick="editCurrentStand()"
          >
            編集
          </button>

          <button
            class="secondary-button"
            type="button"
            onclick="hideStandInfo()"
          >
            閉じる
          </button>
        </div>

        <div class="button-area actual-stand-actions">
          <button
            class="primary-button"
            type="button"
            onclick="editCurrentStand()"
          >
            編集
          </button>
        </div>
      </section>

      <section id="searchResults" class="results-card">
        <h2 class="section-title">検索結果</h2>

        <div class="results-info">
          <span id="resultsCount">0件</span>
          <span>譜面台一覧</span>
        </div>

        <div class="results-wrapper">
          <table id="searchResultsTable" class="results-table">
            <thead>
              <tr>
                <th>ID</th>
                <th>管理パート</th>
                <th>使用状況</th>
                <th>使用可否</th>
                <th>損傷情報</th>
                <th>メモ</th>
                <th>操作</th>
              </tr>
            </thead>

            <tbody id="searchResultsBody"></tbody>
          </table>

          <div id="searchResultsEmpty" class="results-empty">
            一致する譜面台データがありません。
          </div>
        </div>
      </section>

      <!-- ====================================
         追加
         ===================================== -->

      <section id="addCard" class="add-card">
        <h2 class="section-title">譜面台を追加</h2>

        <!-- タイプ -->

        <div class="form-row">
          <label for="standType"> タイプ </label>

          <select id="standType" onchange="handleTypeChange()" required>
            <option value="">タイプを選択</option>
          </select>
        </div>

        <!-- ID -->

        <div class="form-row">
          <label> 譜面台ID </label>

          <div id="newStandId" class="id-display">タイプを選択してください</div>

          <div class="id-note">IDは自動生成されます。</div>
        </div>

        <!-- 管理パート -->

        <div class="form-row">
          <label for="addManagementPart"> 管理パート </label>

          <select id="addManagementPart" required>
            <option value="">管理パートを選択</option>
          </select>
        </div>

        <!-- 使用状況 -->

        <div class="form-row">
          <label for="addUsageStatus"> 使用状況 </label>

          <select id="addUsageStatus" required>
            <option value="">使用状況を選択</option>
          </select>
        </div>

        <!-- 使用可否 -->

        <div class="form-row">
          <label for="addAvailability"> 使用可否 </label>

          <select id="addAvailability" required>
            <option value="">使用可否を選択</option>
          </select>
        </div>

        <!-- 損傷情報 -->

        <div class="form-row">
          <label for="addDamageInfo"> 損傷情報 </label>

          <textarea
            id="addDamageInfo"
            placeholder="損傷や不具合があれば入力してください"
          ></textarea>
        </div>

        <!-- メモ -->

        <div class="form-row">
          <label for="addMemo"> メモ </label>

          <textarea
            id="addMemo"
            placeholder="必要なメモがあれば入力してください"
          ></textarea>
        </div>

        <!-- ボタン -->

        <div class="button-area">
          <button
            id="registerButton"
            class="primary-button"
            type="button"
            onclick="handleRegister()"
          >
            登録する
          </button>

          <button
            class="secondary-button"
            type="button"
            onclick="hideAddForm()"
          >
            閉じる
          </button>
        </div>
      </section>
    </main>

    <!-- ======================================
       JavaScript
       ======================================= -->

    <script src="config.js"></script>

    <script src="api.js"></script>

    <script src="dataStore.js"></script>

    <script>
      /**
       * ========================================
       * 現在表示している譜面台
       * ========================================
       */

      let currentStand = null;

      let actualSearchMode = false;

      let actualResultMode = false;

      let keypadType = "";

      let keypadNumber = "";

      /**
       * ========================================
       * 初期化
       * ========================================
       */

      document.addEventListener("DOMContentLoaded", initializePage);

      async function initializePage() {
        updateLastUpdatedText();

        /**
         * URLパラメータ
         *
         * 例：
         * index.html?id=A-001
         */

        const params = new URLSearchParams(window.location.search);

        const id = params.get("id");

        actualSearchMode = params.get("actual") === "y" && !id;

        if (actualSearchMode) {
          setupActualSearchMode();
        }

        try {
          /**
           * INDEX_CACHE_HOURS は
           * config.jsで
           *
           * 24 * 7
           *
           * に設定する。
           *
           * つまり7日間は
           * 自動的な全データ更新をしない。
           */
          await getStandData(INDEX_CACHE_HOURS);

          updateLastUpdatedText();

          /**
           * ID指定がある場合
           *
           * → ローカルデータから検索
           */
          if (id) {
            const input = document.getElementById("searchInput");

            input.value = id;

            searchStand(id);
          }
        } catch (error) {
          console.error("初期化エラー:", error);

          showMessage(error.message || "データの取得に失敗しました。", "error");
        }
      }

      function setupActualSearchMode() {
        document.getElementById("searchCard").classList.add("actual-hidden");

        document.getElementById("mainMenu").classList.add("actual-hidden");

        document.getElementById("addCard").classList.add("actual-hidden");

        document.getElementById("keypadCard").classList.add("show");

        document.body.classList.add("actual-mode");

        document.body.classList.add("actual-keypad-mode");

        populateKeypadTypes();

        populateKeypadDigits();
      }

      function populateKeypadTypes() {
        const container = document.getElementById("keypadTypes");

        container.innerHTML = "";

        STAND_TYPES.forEach((type) => {
          const button = document.createElement("button");

          button.type = "button";

          button.className = "keypad-type-button";

          button.textContent = type;

          button.setAttribute("aria-pressed", "false");

          button.addEventListener("click", () => selectKeypadType(type));

          container.appendChild(button);
        });
      }

      function populateKeypadDigits() {
        const container = document.getElementById("keypadGrid");

        container.innerHTML = "";

        for (let digit = 1; digit <= 9; digit++) {
          container.appendChild(createKeypadDigitButton(String(digit)));
        }

        container.appendChild(createKeypadDigitButton("0"));
      }

      function createKeypadDigitButton(digit) {
        const button = document.createElement("button");

        button.type = "button";

        button.className = "keypad-key";

        button.textContent = digit;

        button.disabled = true;

        button.addEventListener("click", () => enterKeypadDigit(digit));

        return button;
      }

      function selectKeypadType(type) {
        keypadType = type;

        keypadNumber = "";

        document.querySelectorAll(".keypad-type-button").forEach((button) => {
          button.setAttribute(
            "aria-pressed",
            String(button.textContent === type),
          );
        });

        document
          .querySelectorAll(".keypad-key")
          .forEach((button) => (button.disabled = false));

        document.getElementById("keypadTypeStep").classList.remove("active");

        document.getElementById("keypadNumberStep").classList.add("active");

        hideMessage();

        updateKeypadDisplay();
      }

      function backToKeypadTypes() {
        keypadType = "";

        keypadNumber = "";

        document.getElementById("keypadNumberStep").classList.remove("active");

        document.getElementById("keypadTypeStep").classList.add("active");

        document
          .querySelectorAll(".keypad-type-button")
          .forEach((button) => button.setAttribute("aria-pressed", "false"));

        document
          .querySelectorAll(".keypad-key")
          .forEach((button) => (button.disabled = true));

        hideMessage();

        updateKeypadDisplay();
      }

      function enterKeypadDigit(digit) {
        if (!keypadType || keypadNumber.length >= ID_NUMBER_DIGITS) {
          return;
        }

        keypadNumber += digit;

        updateKeypadDisplay();
      }

      function backspaceKeypadNumber() {
        keypadNumber = keypadNumber.slice(0, -1);

        updateKeypadDisplay();
      }

      function clearKeypadNumber() {
        keypadNumber = "";

        updateKeypadDisplay();
      }

      function updateKeypadDisplay() {
        const display = document.getElementById("keypadIdDisplay");

        if (!keypadType) {
          display.textContent = "タイプを選択してください";
        } else {
          const number = keypadNumber
            ? keypadNumber.padStart(ID_NUMBER_DIGITS, "0")
            : "_".repeat(ID_NUMBER_DIGITS);

          display.textContent = keypadType + "-" + number;
        }

        document.getElementById("keypadSearchButton").disabled =
          !keypadType || keypadNumber.length === 0;
      }

      function searchKeypadStand() {
        if (!keypadType || !keypadNumber) {
          return;
        }

        const id =
          keypadType + "-" + keypadNumber.padStart(ID_NUMBER_DIGITS, "0");

        actualResultMode = true;

        document.body.classList.remove("actual-keypad-mode");

        document.getElementById("keypadCard").classList.remove("show");

        document.getElementById("actualResultPanel").classList.add("show");

        document.getElementById("actualResultMessage").className = "message";

        document.getElementById("actualResultMessage").textContent = "";

        searchStand(id);
      }

      function returnToActualKeypad() {
        actualResultMode = false;

        document.body.classList.add("actual-keypad-mode");

        currentStand = null;

        document.getElementById("actualResultPanel").classList.remove("show");

        document.getElementById("keypadCard").classList.add("show");

        hideStandInfo();

        hideSearchResults();

        backToKeypadTypes();
      }

      /**
       * ========================================
       * 検索
       * ========================================
       */

      function handleSearch() {
        const input = document.getElementById("searchInput");

        const id = input.value.trim().toUpperCase();

        searchStand(id);
      }

      function searchStand(id) {
        const query = String(id || "")
          .trim()
          .toUpperCase();

        if (!query) {
          currentStand = null;

          hideStandInfo();

          hideSearchResults();

          hideMessage();

          return;
        }

        /**
         * GASへ通信しない。
         *
         * localStorageから検索。
         */
        const exactStand = findStandById(query);

        if (exactStand) {
          currentStand = exactStand;

          hideSearchResults();

          displayStand(exactStand);

          hideMessage();

          return;
        }

        currentStand = null;

        hideStandInfo();

        const data = loadStoredStandData() || [];

        const isTypeSearch = STAND_TYPES.some(
          (type) => String(type).trim().toUpperCase() === query,
        );

        const matchingStands = data.filter((stand) => {
          if (isTypeSearch) {
            return String(stand.ID || "")
              .trim()
              .toUpperCase()
              .startsWith(query + "-");
          }

          return [
            stand.ID,
            stand["管理パート"],
            stand["使用状況"],
            stand["使用可否"],
            stand["損傷情報"],
            stand["メモ"],
          ].some((value) =>
            String(value || "")
              .trim()
              .toUpperCase()
              .includes(query),
          );
        });

        renderSearchResults(matchingStands);

        if (matchingStands.length > 0) {
          showMessage("「" + query + "」の検索結果を表示しています。", "info");
        } else {
          showMessage(
            "「" + query + "」に一致する譜面台が見つかりませんでした。",
            "error",
          );
        }
      }

      function renderSearchResults(stands) {
        const section = document.getElementById("searchResults");

        const tbody = document.getElementById("searchResultsBody");

        const table = document.getElementById("searchResultsTable");

        const empty = document.getElementById("searchResultsEmpty");

        tbody.innerHTML = "";

        document.getElementById("resultsCount").textContent =
          stands.length + "件";

        if (stands.length === 0) {
          table.style.display = "none";

          empty.style.display = "block";
        } else {
          table.style.display = "table";

          empty.style.display = "none";

          stands.forEach((stand) => {
            tbody.appendChild(createSearchResultRow(stand));
          });
        }

        section.classList.add("show");
      }

      function createSearchResultRow(stand) {
        const row = document.createElement("tr");

        const idCell = document.createElement("td");

        idCell.className = "result-id-cell";

        idCell.textContent = stand.ID || "";

        const partCell = document.createElement("td");

        partCell.textContent = stand["管理パート"] || "";

        const usageCell = document.createElement("td");

        usageCell.appendChild(createStatusLabel(stand["使用状況"], "usage"));

        const availabilityCell = document.createElement("td");

        availabilityCell.appendChild(
          createStatusLabel(stand["使用可否"], "availability"),
        );

        const damageCell = document.createElement("td");

        damageCell.className = "result-text-cell";

        damageCell.textContent = stand["損傷情報"] || "";

        const memoCell = document.createElement("td");

        memoCell.className = "result-text-cell";

        memoCell.textContent = stand["メモ"] || "";

        const actionCell = document.createElement("td");

        const editButton = document.createElement("button");

        editButton.type = "button";

        editButton.className = "result-edit-button";

        editButton.textContent = "編集";

        editButton.addEventListener("click", () => {
          currentStand = stand;

          editCurrentStand();
        });

        actionCell.appendChild(editButton);

        [
          idCell,
          partCell,
          usageCell,
          availabilityCell,
          damageCell,
          memoCell,
          actionCell,
        ].forEach((cell) => row.appendChild(cell));

        return row;
      }

      function hideSearchResults() {
        document.getElementById("searchResults").classList.remove("show");
      }

      function showMessage(text, type = "info") {
        const element = document.getElementById(
          actualSearchMode
            ? actualResultMode
              ? "actualResultMessage"
              : "keypadMessage"
            : "message",
        );

        element.textContent = text;

        element.className = "message show " + type;
      }

      function hideMessage() {
        const element = document.getElementById(
          actualSearchMode
            ? actualResultMode
              ? "actualResultMessage"
              : "keypadMessage"
            : "message",
        );

        element.className = "message";

        element.textContent = "";
      }

      /**
       * ========================================
       * 譜面台表示
       * ========================================
       */

      function displayStand(stand) {
        const card = document.getElementById("standCard");

        document.getElementById("standId").textContent = stand.ID || "";

        document.getElementById("managementPartValue").textContent =
          stand["管理パート"] || "";

        document.getElementById("usageStatusValue").innerHTML = "";

        document
          .getElementById("usageStatusValue")
          .appendChild(createStatusLabel(stand["使用状況"], "usage"));

        document.getElementById("availabilityValue").innerHTML = "";

        document
          .getElementById("availabilityValue")
          .appendChild(createStatusLabel(stand["使用可否"], "availability"));

        document.getElementById("damageInfoValue").textContent =
          stand["損傷情報"] || "";

        document.getElementById("memoValue").textContent = stand["メモ"] || "";

        card.classList.add("show");
      }

      /**
       * ========================================
       * 状態ラベル
       * ========================================
       */

      function createStatusLabel(value, type) {
        const span = document.createElement("span");

        span.className = "status";

        const text = value || "";

        span.textContent = text;

        if (type === "availability") {
          if (text === "可能") {
            span.classList.add("status-available");
          } else if (text === "注意") {
            span.classList.add("status-warning");
          } else if (text === "不可") {
            span.classList.add("status-unavailable");
          }
        }

        if (type === "usage") {
          if (text === "使用中") {
            span.classList.add("status-using");
          } else if (text === "空き") {
            span.classList.add("status-free");
          }
        }

        return span;
      }

      /**
       * ========================================
       * 譜面台情報を閉じる
       * ========================================
       */

      function hideStandInfo() {
        currentStand = null;

        document.getElementById("standCard").classList.remove("show");
      }

      /**
       * ========================================
       * 編集
       * ========================================
       */

      function editCurrentStand() {
        if (!currentStand || !currentStand.ID) {
          return;
        }

        window.location.href =
          "edit.html?id=" + encodeURIComponent(currentStand.ID);
      }

      /**
       * ========================================
       * 追加フォーム表示
       * ========================================
       */

      function showAddForm() {
        const card = document.getElementById("addCard");

        /**
         * プルダウン設定
         */

        setupStandTypeSelect("standType", "タイプを選択");

        setupManagementPartSelect("addManagementPart", "管理パートを選択");

        setupUsageStatusSelect("addUsageStatus", "使用状況を選択");

        setupAvailabilitySelect("addAvailability", "使用可否を選択");

        card.classList.add("show");

        /**
         * 追加フォームまで
         * スクロール
         */

        card.scrollIntoView({
          behavior: "smooth",
          block: "start",
        });
      }

      /**
       * ========================================
       * 追加フォームを閉じる
       * ========================================
       */

      function hideAddForm() {
        document.getElementById("addCard").classList.remove("show");
      }

      /**
       * ========================================
       * タイプ変更
       * ========================================
       */

      async function handleTypeChange() {
        const type = document.getElementById("standType").value;

        const idElement = document.getElementById("newStandId");

        if (!type) {
          idElement.textContent = "タイプを選択してください";

          return;
        }

        idElement.textContent = "IDを取得中...";

        try {
          /**
           * 次のID取得はGASへ通信。
           *
           * ここは新規登録用の
           * ID生成なので、
           * キャッシュは使わない。
           */
          const nextId = await getNextId(type);

          idElement.textContent = nextId;
        } catch (error) {
          console.error("ID取得エラー:", error);

          idElement.textContent = "ID取得に失敗しました";

          showMessage(error.message || "IDの取得に失敗しました。", "error");
        }
      }

      /**
       * ========================================
       * 登録
       * ========================================
       */

      async function handleRegister() {
        const registerButton = document.getElementById("registerButton");

        registerButton.disabled = true;

        registerButton.textContent = "登録中...";

        hideMessage();

        try {
          const type = document.getElementById("standType").value;

          const id = document.getElementById("newStandId").textContent;

          if (!type) {
            throw new Error("タイプを選択してください。");
          }

          if (!id || id.includes("取得") || id.includes("選択")) {
            throw new Error("譜面台IDを取得してください。");
          }

          const data = {
            ID: id,

            管理パート: document.getElementById("addManagementPart").value,

            使用状況: document.getElementById("addUsageStatus").value,

            使用可否: document.getElementById("addAvailability").value,

            損傷情報: document.getElementById("addDamageInfo").value,

            メモ: document.getElementById("addMemo").value,
          };

          if (!data["管理パート"]) {
            throw new Error("管理パートを選択してください。");
          }

          if (!data["使用状況"]) {
            throw new Error("使用状況を選択してください。");
          }

          if (!data["使用可否"]) {
            throw new Error("使用可否を選択してください。");
          }

          /**
           * ====================================
           * GASへ登録
           * ====================================
           */

          const newStand = await addStand(type, data);

          /**
           * ====================================
           * ローカルデータ更新
           * ====================================
           */

          addStoredStand(newStand);

          updateLastUpdatedText();

          /**
           * 登録した譜面台を表示
           */

          currentStand = newStand;

          displayStand(newStand);

          /**
           * 追加フォームを閉じる
           */

          hideAddForm();

          /**
           * フォームを初期化
           */

          clearAddForm();

          showMessage("譜面台 " + newStand.ID + " を登録しました。", "success");
        } catch (error) {
          console.error("登録エラー:", error);

          showMessage(error.message || "譜面台の登録に失敗しました。", "error");
        } finally {
          registerButton.disabled = false;

          registerButton.textContent = "登録する";
        }
      }

      /**
       * ========================================
       * 追加フォーム初期化
       * ========================================
       */

      function clearAddForm() {
        document.getElementById("standType").value = "";

        document.getElementById("newStandId").textContent =
          "タイプを選択してください";

        document.getElementById("addManagementPart").value = "";

        document.getElementById("addUsageStatus").value = "";

        document.getElementById("addAvailability").value = "";

        document.getElementById("addDamageInfo").value = "";

        document.getElementById("addMemo").value = "";
      }

      /**
       * ========================================
       * 強制更新
       * ========================================
       */

      async function handleRefresh() {
        const button = document.getElementById("refreshButton");

        button.disabled = true;

        button.textContent = "更新中...";

        hideMessage();

        try {
          /**
           * キャッシュを無視して
           * GASから最新一覧を取得。
           */
          await refreshStandData();

          updateLastUpdatedText();

          /**
           * 現在表示中のIDがあれば
           * 最新データで再表示。
           */

          if (currentStand) {
            const updated = findStandById(currentStand.ID);

            if (updated) {
              currentStand = updated;

              displayStand(updated);
            }
          }

          showMessage("最新の情報に更新しました。", "info");
        } catch (error) {
          console.error("更新エラー:", error);

          showMessage(error.message || "更新に失敗しました。", "error");
        } finally {
          button.disabled = false;

          button.textContent = "↻ 更新";
        }
      }

      /**
       * ========================================
       * 最終更新日時
       * ========================================
       */

      function updateLastUpdatedText() {
        const element = document.getElementById("lastUpdated");

        element.textContent = "最終更新：" + getLastUpdatedText();
      }

      /**
       * ========================================
       * メイン画面上の
       * Enterキー検索
       * ========================================
       */

      document.addEventListener("DOMContentLoaded", () => {
        const input = document.getElementById("searchInput");

        input.addEventListener("keydown", (event) => {
          if (event.key === "Enter") {
            handleSearch();
          }
        });
      });

      /**
       * ========================================
       * 一覧画面へ
       * ========================================
       */

      function goToList() {
        window.location.href = "list.html";
      }
    </script>
  </body>
</html>
